# --- General --- #
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g detach-on-destroy off
set -g escape-time 0
set -g set-clipboard on
# set -g status-position top

# --- Keybindings --- #
# Set prefix to C-a
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Split panes with | and -
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Reload config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize pane sizes
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
bind -r m resize-pane -Z

# Kill the current session: auto-switch if only 1 other session, otherwise show list
bind X run-shell "~/.config/tmux/scripts/switch-and-kill.sh"

bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# --- Window and Pane Management --- #
# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Ensure window titles get renamed automatically.
setw -g automatic-rename

# Make new windows inherit cwd instead of $HOME
# set-option -g default-path "#{pane_current_path}" # DEPRECATED
unbind C
bind C new-window -c "#{pane_current_path}"

# --- Clipboard and Copy Mode --- #
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"

# --- History --- #
set-option -g history-limit 100000

# --- Plugins --- #
# TPM (Tmux Plugin Manager)
set-environment -gF TMUX_PLUGIN_MANAGER_PATH "#{HOME}/.config/tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'

# Copy selected text to the system clipboard, including mouse selections.
set -g @yank_with_mouse 'on'
set -g @yank_action 'copy-pipe-and-cancel'

# Pick paths, hashes, URLs, and other tokens with Prefix + f.
set -g @thumbs-key 'f'
set -g @thumbs-osc52 '1'
set -g @thumbs-bg-color '#1e1e2e'
set -g @thumbs-fg-color '#a6e3a1'
set -g @thumbs-hint-bg-color '#313244'
set -g @thumbs-hint-fg-color '#f9e2af'
set -g @thumbs-select-bg-color '#1e1e2e'
set -g @thumbs-select-fg-color '#89b4fa'

# Find and open URLs from the current pane with Prefix + u.
set -g @fzf-url-fzf-options '-p 60%,30% --prompt=" " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Catppuccin Mocha theme configuration
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag,(),}'
set -g window-status-separator '  '
# set -g @catppuccin_status_left_separator ' '
# set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_pane_border_status "yes"
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_directory_text ' #{b:pane_current_path}'
set -g @catppuccin_pane_border_style 'fg=#{@thm_surface_1}'
set -g @catppuccin_pane_active_border_style 'fg=#{@thm_mauve}'

# Load the theme before composing its status modules.
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'
set -g status-left-length 100
set -g status-left '#{E:@catppuccin_status_session} '

# Initialize TPM, then override the message style Catppuccin applies.
run '~/.config/tmux/plugins/tpm/tpm'
set -g message-style 'fg=#94e2d5,bg=#181825,fill=#181825,align=left,width=100%'
set -g message-command-style 'fg=#94e2d5,bg=#181825,fill=#181825,align=left,width=100%'
